spring.datasource.url=${RESERVA_DB_URL:jdbc:h2:mem:reservapatterns;DB_CLOSE_DELAY=-1}
spring.datasource.username=${RESERVA_DB_USER:sa}
spring.datasource.password=${RESERVA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
reserva.security.jwt-secret=${RESERVA_JWT_SECRET}
reserva.bootstrap.username=${RESERVA_ADMIN_USER}
reserva.bootstrap.password=${RESERVA_ADMIN_PASSWORD}
